[project]
name = "deep-search"
version = "0.1.0"
description = "Multi-agent research assistant: a DeepAgents coordinator over web search, MongoDB (via MCP), and RAGFlow knowledge bases"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yiqun Wang" }]
requires-python = ">=3.13"
dependencies = [
    "asyncio>=4.0.0",
    "contextvars>=2.4",
    "datetime>=6.0",
    "deepagents>=0.7.13",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "google>=3.0.0",
    "google-genai>=2.20.0",
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "markdown>=3.10.3",
    "mcp>=2.2,<3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pypdf>=6.17.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "ragflow-sdk>=0.27.1",
    "tavily-python>=0.8.0",
    "typing>=3.10.0.0",
    "uvicorn[standard]>=0.30",
    "weasyprint>=69.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pymongo>=4.10",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
pythonpath = ["."]
