[project]
name = "deep-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncio>=4.0.0",
    "contextvars>=2.4",
    "datetime>=6.0",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "google>=3.0.0",
    "google-genai>=2.20.0",
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "markdown>=3.10.3",
    "mysql-connector-python>=26.7.0",
    "pydantic>=2.13.5",
    "ragflow-sdk>=0.27.1",
    "tavily-python>=0.8.0",
    "typing>=3.10.0.0",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
